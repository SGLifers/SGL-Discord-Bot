AWSTemplateFormatVersion: '2010-09-09'
Description: SGL lobby announcements. On-demand Discord REST bot; no always-on server or Gateway connection.
Parameters:
  CodeBucket: {Type: String}
  CodeKey: {Type: String}
  StatsApiFunctionArn: {Type: String, Default: '', Description: 'Optional SplitStatsInfra API function ARN for signed Discord commands.'}
  GuildId: {Type: String, AllowedPattern: '[0-9]{17,20}'}
  ChannelId: {Type: String, AllowedPattern: '[0-9]{17,20}'}
  HostRoleId: {Type: String, Default: '', AllowedPattern: '([0-9]{17,20}(,[0-9]{17,20})*)?', Description: 'Comma-separated host role IDs; any matching role permits announcements.'}
  AllowedHostIds: {Type: String, Default: '', AllowedPattern: '([0-9]{17,20}(,[0-9]{17,20})*)?'}
  SglIdentityUrl: {Type: String, Default: 'https://7l2zchnk7d.execute-api.us-west-2.amazonaws.com', AllowedPattern: 'https://[^\s?#@]+'}
  AnnouncementsEnabled: {Type: String, Default: 'false', AllowedValues: ['true', 'false']}
  AlarmEmail: {Type: String, AllowedPattern: '[^\s@]+@[^\s@]+\.[^\s@]+'}
Conditions:
  HasStats: !Not [!Equals [!Ref StatsApiFunctionArn, '']]
Resources:
  State:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
  BotSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Discord bot token for SGL lobby announcements. Configure locally after deployment.
      SecretString: '{"token":""}'
  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties: {RetentionInDays: 14}
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties: {RetentionInDays: 14}
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: ScopedAnnouncementAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: ['dynamodb:GetItem', 'dynamodb:PutItem'], Resource: !GetAtt State.Arn}
              - {Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref BotSecret}
              - !If
                - HasStats
                - {Effect: Allow, Action: 'lambda:InvokeFunction', Resource: !Ref StatsApiFunctionArn}
                - !Ref AWS::NoValue
              - {Effect: Allow, Action: ['logs:CreateLogStream', 'logs:PutLogEvents'], Resource: !GetAtt FunctionLogs.Arn}
  Function:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Architectures: [arm64]
      Handler: handler.handler
      Role: !GetAtt Role.Arn
      Timeout: 45
      MemorySize: 256
      LoggingConfig: {LogGroup: !Ref FunctionLogs}
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey}
      Environment:
        Variables:
          STATS_API_FUNCTION_ARN: !Ref StatsApiFunctionArn
          STATE_TABLE: !Ref State
          BOT_SECRET_ARN: !Ref BotSecret
          SGL_IDENTITY_URL: !Ref SglIdentityUrl
          DISCORD_GUILD_ID: !Ref GuildId
          DISCORD_CHANNEL_ID: !Ref ChannelId
          HOST_ROLE_ID: !Ref HostRoleId
          ALLOWED_HOST_IDS: !Ref AllowedHostIds
          ANNOUNCEMENTS_ENABLED: !Ref AnnouncementsEnabled
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties: {Name: !Sub '${AWS::StackName}', ProtocolType: HTTP}
  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000
  StatsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: POST /stats/interactions
      Target: !Join ['/', [integrations, !Ref Integration]]
  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref Api, RouteKey: 'GET /health', Target: !Sub 'integrations/${Integration}'}
  AnnounceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref Api, RouteKey: 'POST /announcements', Target: !Sub 'integrations/${Integration}'}
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings: {ThrottlingRateLimit: 1, ThrottlingBurstLimit: 2}
      AccessLogSettings:
        DestinationArn: !GetAtt ApiLogs.Arn
        Format: '{"requestId":"$context.requestId","status":"$context.status"}'
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties: {Action: 'lambda:InvokeFunction', FunctionName: !Ref Function, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/*', SourceAccount: !Ref 'AWS::AccountId'}
  Alerts:
    Type: AWS::SNS::Topic
    Properties:
      Subscription: [{Protocol: email, Endpoint: !Ref AlarmEmail}]
  FunctionErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: SGL hosting Lambda errors. Check sanitized logs; never add tokens or request bodies to logs.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref Function}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]
  ApiErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: SGL hosting announcement API server errors.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{Name: ApiId, Value: !Ref Api}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]
Outputs:
  ApiUrl: {Value: !GetAtt Api.ApiEndpoint}
  BotSecretArn: {Value: !Ref BotSecret}
  StateTable: {Value: !Ref State}
  FunctionName: {Value: !Ref Function}
